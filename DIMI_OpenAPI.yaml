  /hometown-groups/join:
    post:
      tags: [HometownGroups]
      summary: 加入（或创建）老乡群
      description: |
        可选 body.region_code 指定当前浏览的家乡页；与本人家乡不同市时返回 40301。未传时以本人家乡（type=1）的市级前缀为准。幂等：群不存在则由本次调用创建
        （created=true，调用者成为群主并直接入群，群标题形如"{市名}老乡群"）；
        已存在则直接入群（created=false），重复调用不产生重复成员。
        未设置家乡（type=1）时 40301；不要求与其他群成员互为好友。
        群无主（created_by 为 NULL，正常路径=空群待任）时由本次加入者继任群主。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                region_code: { type: string, description: 当前家乡页的行政区划编码，须与本人家乡同市 }
      responses:
        '200':
          description: 入群成功（含本次是否新建群）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HometownGroupJoinResult' }
        '403':
          description: 未设置家乡（40301）
          content:
            application/json:
