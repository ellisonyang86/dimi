openapi: 3.0.3
info:
  title: DIMI · 围城 API
  description: |
    DIMI · 围城 社交平台全量接口文档。
    通用约定：
    - 鉴权：`Authorization: Bearer <access_token>`（OAuth 接口除外）
    - 响应结构：`{ code, message, data, trace_id }`，code=0 成功
    - 分页：Feed/消息流用 cursor 游标；Discover 检索/推荐（/discover/classmates、
      /discover/classmates/mine、/discover/fellows、/discover/recommendations、/discover/search-user）用 page/size
      （page/size 须为正整数；page 默认 1，size 默认 20 上限 50，翻页深度受限），其响应 next_cursor 语义为
      「下一页页码字符串，无下一页为 null」；先执行可见性过滤，再计算分页，隐藏用户不占页内名额
    - 幂等：写接口支持 `Idempotency-Key` 请求头
    - 安全约定：/media/* 为免鉴权随机名 URL（16 位 hex 不可猜），敏感素材请勿外链分享；
      拉黑互查场景（如好友申请时任一方向存在拉黑）返回 200 + request_id:null 为刻意防探测设计，非异常
    - 错误码段：40001 参数错误 / 40101 未登录 / 40301 隐私限制 / 42901 频控 /
      41001 资源不存在 / 45001 内容安全拦截 / 50000 系统错误
    - 姓名展示：所有返回用户对象的接口，real_name 字段由服务端按
      「真名渐显矩阵」判定后直接返回展示值（全名/掩码/null），客户端不得二次加工
    V3.0/V3.1 约定：
    - 验证等级：教育经历按 V0 自述 / V1 同窗互证 / V2 证据验证 / V3 组织背书分层，
      取代原 is_verified 布尔字段（§3.1）
    - 人脸合规红线（A8）：不做人脸识别检索；人脸核验不作为唯一验证方式；
      人脸特征即用即删（核验完成即删，仅留存结果记录，不存特征数据）；
      人脸信息存储数量达 10 万人之日起 30 个工作日内向省级以上网信部门备案（A2.2）
    - 会员红线：会员（DIMI+）只出售"自己能力的增强"，永不出售"他人信息的访问权"——
      无检索豁免、无隐私突破、无推荐加权、不做隐身访问（§11.1）
    - 资金红线：聚会 AA 仅记账不动钱，平台不碰支付、不经手资金（A6/A8）
  version: 3.1.0
servers:
  - url: https://api.dimi.example.com/v1
tags:
  - { name: Auth, description: 账号与登录 }
  - { name: Captcha, description: 滑块人机验证 }
  - { name: Users, description: 用户资料 }
  - { name: Educations, description: 教育经历 }
  - { name: Hometown, description: 家乡与现居地 }
  - { name: Discover, description: 找人（检索与推荐） }
  - { name: Friends, description: 好友关系 }
  - { name: Messages, description: 单聊/群聊消息 }
  - { name: ClassGroups, description: 班级群聊（按班级单元自动聚班，V0.9 已实现） }
  - { name: HometownGroups, description: 老乡群聊（按家乡同市自动聚群，与老乡圈同边界） }
  - { name: HometownPages, description: 家乡页（镇级共建页+投稿，M1 已实现：最新区/浏览/点赞/关注/公开落地页；热度榜/置顶/守护人属 M2） }
  - { name: Groups, description: 群组 }
  - { name: Moments, description: 朋友圈 }
  - { name: Articles, description: 长文（文章） }
  - { name: Privacy, description: 隐私设置 }
  - { name: OAuth, description: 开放平台（第三方登录） }
  - { name: Notifications, description: 通知 }
  - { name: Misc, description: 举报/反馈/申诉/基础数据 }
  - { name: Wallet, description: 觅豆钱包/红包/动态打赏（P0 纯赠送体系：无充值、无提现、无现金价值，币来源仅任务赠送） }
  - { name: Admin, description: 内部运营通道（/admin-api/*，不走 bearerAuth 用户鉴权，见各端点说明） }
  - { name: Verification, description: 经历验证（V0–V3 分层验证） }
  - { name: ClassPhotos, description: 云班级毕业照（标注与认领） }
  - { name: Events, description: 聚会 }
  - { name: Calendar, description: 场景日历 }
  - { name: Assist, description: 代际协助（子女协助父母） }
  - { name: Subscription, description: 会员（DIMI+） }
  - { name: AI, description: 小觅助理 }
  - { name: Safety, description: 算法与安全合规 }

paths:
  # ============ Captcha ============
  /captcha/slider:
    get:
      tags: [Captcha]
      summary: 获取滑块验证码挑战
      description: |
        免鉴权，限流 30 次/小时/IP。返回缺口纵坐标与确定性背景种子，客户端据此渲染背景与滑块；
        缺口横坐标 target_x 只存服务端（范围 40–230），不下发。挑战一次性、5 分钟过期。
      responses:
        '200':
          description: 挑战参数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          captcha_id: { type: string }
                          width: { type: integer, example: 280 }
                          height: { type: integer, example: 160 }
                          notch_y: { type: integer, description: 缺口纵坐标 }
                          bg_seed: { type: string, description: 客户端画确定性背景的种子 }
                          expires_in: { type: integer, example: 300 }
        '429': { $ref: '#/components/responses/RateLimited' }
  /captcha/verify:
    post:
      tags: [Captcha]
      summary: 校验滑块结果并签发一次性 captcha_token
      description: |
        校验 |x - target_x| <= 6。挑战无论成败都标记已用（防暴力枚举 x）。
        通过则签发 captcha_token（随机串，5 分钟有效，消费后作废），
        用于 42901 need_captcha 场景（检索超频/翻页过深等），经 query.captcha_token、
        body.captcha_token 或 X-Captcha-Token 头携带；通过则放行并重置该计数窗口。
        开发模式（DIMI_SMS_DEV=true）接受 dev_bypass 作为 token，生产拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [captcha_id, x]
              properties:
                captcha_id: { type: string }
                x: { type: integer, description: 用户滑到的缺口横坐标 }
      responses:
        '200':
          description: 验证通过
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          captcha_token: { type: string, description: 一次性，5 分钟有效 }
                          expires_in: { type: integer, example: 300 }
        '400':
          description: 验证失败（challenge 不存在/过期/已用/偏差超容差）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 40001, message: "滑块验证失败，请重新获取验证码", data: null, trace_id: "t-001" }
  # ============ Auth ============
  /auth/sms/send:
    post:
      tags: [Auth]
      summary: 发送短信验证码
      description: |
        同号 60s 内限 1 条，日限 10 条。默认不强制图形验证；触发频控上限时返回 42901
        （data.need_captcha=true），客户端调 /captcha/slider + /captcha/verify 取得
        captcha_token 后随请求重试（body.captcha_token / query / X-Captcha-Token 头），
        验证通过即放行并重置该计数窗口。开发模式（DIMI_SMS_DEV=true）接受 dev_bypass。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "13800005678" }
                captcha_token: { type: string, description: 触发 42901 need_captcha 后重试时携带的滑块验证通过凭证（一次性） }
                scene: { type: string, enum: [register, login, reset_password, change_phone, set_password] }
      responses:
        '200': { $ref: '#/components/responses/OkEmpty' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/register:
    post:
      tags: [Auth]
      summary: 手机号注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, sms_code, nickname]
              properties:
                phone: { type: string }
                sms_code: { type: string, example: "483920" }
                nickname: { type: string, maxLength: 32 }
                password: { type: string, description: 可选，可后补 }
                gender: { type: integer, enum: [0, 1, 2] }
                birth_year: { type: integer, example: 1984 }
                invite_channel: { type: string, description: 邀请渠道码（召集令/校友会） }
                agreement_version: { type: string, maxLength: 32, description: 可选，注册时勾选的《用户服务协议》《隐私政策》版本号（如 ua-0.9+pp-0.9），写入审计日志留痕 }
      responses:
        '200':
          description: 注册成功，返回 token 与用户对象（need_verify 恒为 0，与登录响应对齐）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/AuthToken'
                          - type: object
                            properties:
                              need_verify: { type: integer, enum: [0, 1], description: 注册场景恒为 0 }
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录（验证码/密码/第三方）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [sms, password, wechat, apple, one_click], description: 当前实现仅支持 sms / password；wechat / apple / one_click 为规划态（第三方登录 V1.x） }
                phone: { type: string }
                sms_code: { type: string }
                password: { type: string }
                third_token: { type: string, description: 微信/Apple/运营商授权凭证（规划态，随 grant_type 第三方档位开放） }
                device_info: { type: string, example: "iPhone 15 Pro / iOS 18", description: 设备描述串（≤128 字，缺省取 User-Agent），用于登录设备管理 }
      responses:
        '200':
          description: 登录成功；新设备/异地登录可能返回 need_verify=1 要求二次验证
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/AuthToken'
                          - type: object
                            properties:
                              need_verify: { type: integer, enum: [0, 1] }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新 access_token（滑动续期）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties: { refresh_token: { type: string } }
      responses:
        '200':
          description: 新 token 对
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthToken' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出当前设备
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /auth/devices:
    get:
      tags: [Auth]
      summary: 登录设备列表
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/DeviceInfo' }
  /auth/devices/{device_id}:
    delete:
      tags: [Auth]
      summary: 下线指定设备
      security: [{ bearerAuth: [] }]
      parameters: [ { name: device_id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /auth/deactivate:
    post:
      tags: [Auth]
      summary: 注销账号（7 天冷静期，期间登录即撤销）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sms_code]
              properties:
                sms_code: { type: string, description: 二次验证 }
                reason: { type: string }
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /auth/password:
    post:
      tags: [Auth]
      summary: 设置/修改登录密码（敏感操作，短信二次验证）
      description: 注册后补设密码与已有密码改密共用本端点；新密码 ≥8 位，按 scrypt 哈希存储
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password, sms_code]
              properties:
                new_password: { type: string, minLength: 8, maxLength: 64 }
                sms_code: { type: string, description: 本机手机号收到的短信验证码（二次验证） }
      responses:
        '200':
          description: 设置成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          password_set: { type: boolean }
                          changed: { type: boolean, description: true=改密（原已有密码），false=首次设置 }
        '400':
          description: 密码不合规或验证码错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 40001, message: "验证码错误或已过期", data: null, trace_id: "t-001" }

  # ============ Users ============
  /users/me:
    get:
      tags: [Users]
      summary: 我的完整资料（含设置）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 用户对象（本人视角，全字段）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserSelf' }
    put:
      tags: [Users]
      summary: 更新资料
      description: real_name 每年限改 1 次（超限返回 40001）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 32 }
                real_name: { type: string, maxLength: 32 }
                avatar_url: { type: string, description: 头像地址；取 /misc/upload 返回的 /media/ url（jpg/jpeg/png/webp）原样提交 }
                avatar_media_id: { type: string, deprecated: true, description: 旧字段名，等价于 avatar_url，新客户端请用 avatar_url }
                moment_cover: { type: string, nullable: true, description: 朋友圈封面；取 /misc/upload 返回的 /media/ url（jpg/jpeg/png/webp）原样提交，null 表示清除，非法值返回 40001 }
                gender: { type: integer, enum: [0, 1, 2] }
                birth_year: { type: integer, nullable: true }
                signature: { type: string, maxLength: 60 }
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /users/me/dimi-no:
    put:
      tags: [Users]
      summary: 设置或修改 DIMI 号
      description: |
        首次可设置，此后每 365 天可修改一次。字母开头，6–20 位字母、数字、下划线或短横线，
        大小写不敏感并统一小写。DM 纯数字号为系统保留；旧号不再可搜索且禁止其他账号占用。
        重复提交当前号不消耗修改机会。二维码与好友关系使用稳定 user_id，不受修改影响。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dimi_no]
              properties:
                dimi_no: { type: string, minLength: 6, maxLength: 20, example: dimi_friend }
      responses:
        '200':
          description: 更新后的本人资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserSelf' }
        '400':
          description: 40001 格式错误、号已占用或仍在修改间隔内
  /users/{user_id}:
    get:
      tags: [Users]
      summary: 查看他人资料卡
      description: |
        返回字段经可见性决策引擎处理：不满足可见性的字段整块缺省（不返回），
        而非返回占位值。含 intersection（双方交集标签快照）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: user_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200':
          description: 他人视角用户对象（字段按需缺省）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserCard' }
        '403': { $ref: '#/components/responses/PrivacyBlocked' }
  /users/me/contacts-visibility:
    get:
      tags: [Users]
      summary: 获取联系方式可见范围（手机号/微信号/邮箱分项）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 三项可见范围（未设置项默认 self）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          contacts_visibility:
                            type: object
                            properties:
                              phone: { $ref: '#/components/schemas/ContactVisibility' }
                              wechat: { $ref: '#/components/schemas/ContactVisibility' }
                              email: { $ref: '#/components/schemas/ContactVisibility' }
    put:
      tags: [Users]
      summary: 设置联系方式可见范围（手机号/微信号/邮箱分项）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { $ref: '#/components/schemas/ContactVisibility' }
                wechat: { $ref: '#/components/schemas/ContactVisibility' }
                email: { $ref: '#/components/schemas/ContactVisibility' }
      responses:
        '200':
          description: 设置成功，返回最新三项可见范围（未设置项默认 self）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          contacts_visibility:
                            type: object
                            properties:
                              phone: { $ref: '#/components/schemas/ContactVisibility' }
                              wechat: { $ref: '#/components/schemas/ContactVisibility' }
                              email: { $ref: '#/components/schemas/ContactVisibility' }
  /users/me/contact-viewers:
    get:
      tags: [Users]
      summary: 谁查看过我的联系方式（审计回看，仅近 30 天）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: cursor, in: query, schema: { type: string } } ]
      responses:
        '200':
          description: 查看记录分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CursorPage_UserBrief' }

  # ============ Educations ============
  /users/me/educations:
    get:
      tags: [Educations]
      summary: 我的教育经历列表
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 经历列表（每条含已注册同学数预览）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Education' }
    post:
      tags: [Educations]
      summary: 添加教育经历
      description: 同学段可多条（转学/复读）；班级名服务端归一化
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, school_id, enroll_year]
              properties:
                stage: { $ref: '#/components/schemas/Stage' }
                school_id: { type: integer, format: int64 }
                school_name_snapshot: { type: string, description: 入学时校名 }
                enroll_year: { type: integer, example: 1996 }
                class_name: { type: string, example: "六年2班" }
                department: { type: string, description: 大学：院系 }
                major: { type: string, description: 大学：专业 }
                visibility: { $ref: '#/components/schemas/Visibility' }
      responses:
        '200':
          description: 创建成功；data.registered_count 为该经历已注册同学数（冷启动钩子）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          education: { $ref: '#/components/schemas/Education' }
                          registered_count: { type: integer, example: 89 }
  /users/me/educations/{education_id}:
    put:
      tags: [Educations]
      summary: 修改经历（含可见性）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: education_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Education' }
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
    delete:
      tags: [Educations]
      summary: 删除经历（将同步影响交集计算与同窗标记）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: education_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /schools/search:
    get:
      tags: [Educations]
      summary: 学校联想搜索（支持曾用名/简称/模糊纠错）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: keyword, in: query, required: true, schema: { type: string }, example: 城关二小 }
        - { name: region_code, in: query, schema: { type: string }, description: 限定地区提高准确度 }
      responses:
        '200':
          description: 学校候选列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/School' }
  /schools/apply:
    post:
      tags: [Educations]
      summary: 申请共建新学校（运营审核 SLA 3 个工作日）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, region_code]
              properties:
                name: { type: string }
                region_code: { type: string }
                evidence_urls: { type: array, items: { type: string }, description: 佐证材料 }
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }

  # ============ Hometown ============
  /users/me/hometown:
    get:
      tags: [Hometown]
      summary: 我的家乡/现居地列表
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 家乡（type=1）与现居地（type=2）列表，path 为行政区划链路名称
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                type: { type: integer, enum: [1, 2], description: 1 家乡 / 2 现居地 }
                                region_code: { type: string, example: "411623102" }
                                region_name: { type: string, nullable: true, example: 城关镇, description: 最末级行政区名 }
                                path: { type: array, items: { type: string }, example: ["河南省", "周口市", "沈丘县", "城关镇"], description: 省→市→区县→镇 名称链 }
                                visibility: { $ref: '#/components/schemas/Visibility' }
    put:
      tags: [Hometown]
      summary: 设置家乡（精确到镇）/现居地（到城市）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, region_code]
              properties:
                type: { type: integer, enum: [1, 2], description: 1 家乡 / 2 现居地 }
                region_code: { type: string, example: "411623102", description: 四级行政区划码 }
                visibility: { $ref: '#/components/schemas/Visibility' }
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /regions:
    get:
      tags: [Hometown]
      summary: 行政区划树查询（四级联动数据源）
      parameters:
        - { name: parent_code, in: query, schema: { type: string }, description: 空=省级列表 }
        - { name: tree, in: query, schema: { type: string, enum: ["1", "true"] }, description: 传 1/true 返回整棵嵌套树（元素含 children 递归字段），与 parent_code 模式互斥 }
      responses:
        '200':
          description: 下级地区列表；tree=1 时为全量嵌套树（children 递归同结构）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                code: { type: string }
                                name: { type: string }
                                level: { type: integer, enum: [1, 2, 3, 4] }
                                children: { type: array, items: { type: object }, description: 仅 tree=1 时返回，递归同结构 }

  # ============ Discover ============
  /discover/classmates:
    get:
      tags: [Discover]
      summary: 找同学检索（锚点强制：学校+届）
      description: |
        姓名检索必须携带 school_id+enroll_year；频控 60 次/小时，
        翻页深度 ≤200 条；返回姓名按渐显矩阵处理
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: school_id, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: enroll_year, in: query, required: true, schema: { type: integer } }
        - { name: class_norm, in: query, schema: { type: string }, description: 归一化班级 }
        - { name: name, in: query, schema: { type: string }, description: 姓名（可选，支持模糊） }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 }, description: 页码，从 1 开始 }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 }, description: 每页条数，上限 50 }
      responses:
        '200':
          description: 结果列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiscoverResult' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /discover/classmates/mine:
    get:
      tags: [Discover]
      summary: 我的某段经历下的同学名录（同班/同届/同校三 Tab）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: education_id, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: scope, in: query, schema: { type: string, enum: [class, grade, school], default: class } }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 }, description: 页码，从 1 开始 }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 }, description: 每页条数，上限 50 }
      responses:
        '200':
          description: 同学名录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiscoverResult' }
  /discover/fellows:
    get:
      tags: [Discover]
      summary: 找老乡检索（锚点：区县以上地区）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: region_code, in: query, required: true, schema: { type: string } }
        - { name: level, in: query, schema: { type: integer, enum: [2, 3, 4], default: 3 }, description: 匹配粒度 }
        - { name: name, in: query, schema: { type: string } }
        - { name: gender, in: query, schema: { type: integer, enum: [1, 2] } }
        - { name: age_range, in: query, schema: { type: string, example: "1980-1990" } }
        - { name: live_city_code, in: query, schema: { type: string }, description: 现居城市筛选 }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: 同乡列表（女性保护规则由服务端施加）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiscoverResult' }
  /discover/recommendations:
    get:
      tags: [Discover]
      summary: 推荐 Feed（人脉首页卡片流）
      description: |
        personalized_recommend=false 时返回空 items 和 next_cursor=null，不影响主动检索。
        推荐排除已是好友、双向尚未过期的待处理好友申请，以及本人标记不感兴趣的对象。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: scene, in: query, schema: { type: string, enum: [home, classmate, fellow], default: home } }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 }, description: 页码，从 1 开始 }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 }, description: 每页条数，上限 50 }
      responses:
        '200':
          description: 推荐卡片（含 reason 推荐理由标签，必显）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiscoverResult' }
  /discover/feedback:
    post:
      tags: [Discover]
      summary: 推荐负反馈（不感兴趣/减少此类）
      description: not_interested 会排除该对象；reduce_similar 目前仅记录反馈，尚无同类降权策略，客户端不展示该选项。
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id, action]
              properties:
                target_user_id: { type: integer, format: int64 }
                action: { type: string, enum: [not_interested, reduce_similar] }
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /discover/placeholders:
    get:
      tags: [Discover]
      summary: 班级预占位名册（沉睡名字，不含任何联系方式；A7「沉睡不可见」原则）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: education_id, in: query, schema: { type: integer, format: int64 }, description: 与 school_id+enroll_year+class_norm 二选一 }
        - { name: school_id, in: query, schema: { type: integer, format: int64 } }
        - { name: enroll_year, in: query, schema: { type: integer } }
        - { name: class_norm, in: query, schema: { type: string }, description: 归一化班级 }
      responses:
        '200':
          description: 名册（rally_ready=true 表示该班已达召集令触发条件，即已注册 ≥3 人）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlaceholderRoster' }
    post:
      tags: [Discover]
      summary: 为未注册同学"点亮名字"（预占位）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [education_id, name]
              properties:
                education_id: { type: integer, format: int64 }
                name: { type: string }
      responses:
        '200':
          description: 占位成功；data.rally_ready=true 表示该班已达召集令触发条件（≥3 人）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PlaceholderRoster' }
  /discover/search-user:
    get:
      tags: [Discover]
      summary: DIMI号/手机号精确找人
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dimi_no, in: query, schema: { type: string } }
        - { name: phone, in: query, schema: { type: string } }
      responses:
        '200':
          description: 精确匹配（0 或 1 条）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiscoverResult' }

  # ============ Friends ============
  /friends/requests:
    post:
      tags: [Friends]
      summary: 发送好友申请（验证语必填；联系方式模式将被拦截 45001）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: Idempotency-Key, in: header, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_user_id, verify_msg]
              properties:
                to_user_id: { type: integer, format: int64 }
                verify_msg: { type: string, maxLength: 50, example: 我是96届六年2班的王丽 }
                attach_real_name: { type: boolean, default: true, description: 向对方披露真名 }
                attach_education: { type: boolean, default: false }
                source: { type: string, enum: [classmate_search, fellow_search, recommendation, group, qrcode, dimi_no, contact_match, business_card] }
      responses:
        '200':
          description: |
            申请已受理。任一方向存在拉黑时静默返回 200 + request_id:null（刻意防探测设计，§22.2 [1]）；
            已有 pending 申请时幂等返回原 request_id 且 duplicated=true
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          request_id: { type: integer, format: int64, nullable: true, description: 拉黑互查命中时为 null（防探测） }
                          duplicated: { type: boolean, description: true=存在 pending 申请，幂等返回原单 }
        '450': { $ref: '#/components/responses/ContentBlocked' }
    get:
      tags: [Friends]
      summary: 申请列表（收件箱/发件箱）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: box, in: query, schema: { type: string, enum: [inbox, outbox], default: inbox } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: 申请列表（含交集快照 intersection_snapshot）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/FriendRequest' }
                          next_cursor: { type: string, nullable: true }
  /friends/requests/{request_id}/accept:
    post:
      tags: [Friends]
      summary: 通过申请（服务端自动生成交集破冰消息）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: request_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200':
          description: 建立好友关系，返回会话 ID
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          conversation_id: { type: integer, format: int64 }
  /friends/requests/{request_id}/reject:
    post:
      tags: [Friends]
      summary: 拒绝申请（不通知对方，30 天内对方不可再申请）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: request_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /friends:
    get:
      tags: [Friends]
      summary: 好友列表（含标签分组）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tag, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: 好友分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CursorPage_UserBrief' }
  /friends/{friend_id}:
    put:
      tags: [Friends]
      summary: 设置备注/标签/星标
      security: [{ bearerAuth: [] }]
      parameters: [ { name: friend_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remark_name: { type: string, maxLength: 32 }
                tags: { type: array, items: { type: string } }
                is_starred: { type: boolean }
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
    delete:
      tags: [Friends]
      summary: 删除好友（单向删除，对齐微信）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: friend_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /friends/{friend_id}/block:
    post:
      tags: [Friends]
      summary: 拉黑（双向断联：不可检索/消息/朋友圈）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: friend_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
    delete:
      tags: [Friends]
      summary: 移出黑名单
      security: [{ bearerAuth: [] }]
      parameters: [ { name: friend_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /friends/blocks:
    get:
      tags: [Friends]
      summary: 黑名单列表（管理闭环：拉黑后可在此查看/解除）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 我拉黑的用户列表（按拉黑时间倒序，不分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              allOf:
                                - $ref: '#/components/schemas/UserBrief'
                                - type: object
                                  properties:
                                    blocked_at: { type: string, format: date-time }

  # ============ Messages ============
  /conversations:
    post:
      tags: [Messages]
      summary: 发起单聊会话（幂等：已有会话直接返回）
      description: 陌生人消息（§9.3.2）：V0.9 仅好友可发起单聊，非好友 40301
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_user_id]
              properties:
                to_user_id: { type: integer, format: int64 }
      responses:
        '200':
          description: 会话对象（已有会话幂等返回）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Conversation' }
        '403': { $ref: '#/components/responses/PrivacyBlocked' }
    get:
      tags: [Messages]
      summary: 会话列表
      security: [{ bearerAuth: [] }]
      parameters: [ { name: cursor, in: query, schema: { type: string } } ]
      responses:
        '200':
          description: 会话分页（含未读数/免打扰/置顶）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Conversation' }
                          next_cursor: { type: string, nullable: true }
  /conversations/{conv_id}:
    delete:
      tags: [Messages]
      summary: 删除本人的聊天和历史记录
      description: |
        仅清除本人的历史消息可见位点并隐藏会话；不影响对方记录、好友关系或群成员身份。
        新消息使会话重新出现；历史分页和增量接口均不可读取已清除记录。
      security: [{ bearerAuth: [] }]
      parameters: [ { name: conv_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '403': { $ref: '#/components/responses/PrivacyBlocked' }
  /conversations/{conv_id}/messages:
    post:
      tags: [Messages]
      summary: 发送消息（client_msg_id 幂等防重）
      description: |
        单聊（conv_type=single）：须为好友且未被拉黑，否则 40301。
        群聊（conv_type=group，班级群）：群成员即可发言，不要求互为好友，跳过好友/拉黑校验；
        群发言频控 30 条/60s（群维度独立计数，超限 42901）。非会话成员一律 40301。
        image/voice/video 消息的 content 须为 /misc/upload 返回的媒体 url，扩展名按类型分档
        （image=jpg/jpeg/png/webp，voice=m4a/aac，video=mp4/mov），不符 40001。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conv_id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_msg_id, msg_type]
              properties:
                client_msg_id: { type: string, description: 客户端幂等键 }
                msg_type: { $ref: '#/components/schemas/MsgType' }
                content: { type: string, description: 文本内容/媒体 media_id/位置JSON }
                at_user_ids: { type: array, items: { type: integer, format: int64 }, description: 群内@ }
      responses:
        '200':
          description: 消息已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          msg_id: { type: integer, format: int64 }
                          server_time: { type: string, format: date-time }
    get:
      tags: [Messages]
      summary: 拉取历史消息（漫游）
      description: |
        两种模式互斥：
        - 默认 cursor 游标分页：倒序返回最近一页，next_cursor 续拉更早消息；
        - 传 since_msg_id 进入增量模式：返回该 msg_id 之后的消息（正序，封顶 limit 条），
          next_cursor 恒为 null，用于断线重连后的增量同步。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conv_id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: cursor, in: query, schema: { type: string }, description: 空=最新一页 }
        - { name: since_msg_id, in: query, schema: { type: integer, format: int64 }, description: 增量模式：只返回该消息之后的消息（正序）；与 cursor 互斥，传了优先生效 }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: 消息分页（倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Message' }
                          next_cursor: { type: string, nullable: true }
  /conversations/{conv_id}/read:
    post:
      tags: [Messages]
      summary: 上报已读位置
      security: [{ bearerAuth: [] }]
      parameters: [ { name: conv_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { last_read_msg_id: { type: integer, format: int64 } }
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /messages/{msg_id}/recall:
    post:
      tags: [Messages]
      summary: 撤回消息（发送后 2 分钟内）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: msg_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /conversations/{conv_id}/settings:
    put:
      tags: [Messages]
      summary: 会话设置（置顶/免打扰/折叠）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: conv_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_pinned: { type: boolean }
                is_muted: { type: boolean }
                is_folded: { type: boolean }
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /conversations/{conv_id}/contact-card:
    post:
      tags: [Messages]
      summary: 发起"交换联系方式"卡片（§20.4）【规划态 V1.x，当前未实现】
      description: 规划态 V1.x，当前服务端未实现；契约先行，客户端不得依赖该端点可用
      security: [{ bearerAuth: [] }]
      parameters: [ { name: conv_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { type: string, enum: [phone, wechat, email] }
                  description: 要分享的联系方式项
                request_reciprocal: { type: boolean, default: false, description: 请求对方回赠 }
                view_once: { type: boolean, default: false, description: 阅后隐藏（禁截屏） }
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }
  /conversations/{conv_id}/contact-card/{card_id}/revoke:
    post:
      tags: [Messages]
      summary: 撤回我共享的联系方式（对方端卡片失效）【规划态 V1.x，当前未实现】
      description: 规划态 V1.x，当前服务端未实现；契约先行，客户端不得依赖该端点可用
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conv_id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: card_id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { $ref: '#/components/responses/OkEmpty' } }

  # ============ ClassGroups（班级群聊，V0.9 已实现并联调通过） ============
  # 语义：班级单元（school_id+enroll_year+class_name_norm）一一对应一个群会话；
  # 入群依据=本人有该班级单元的教育经历（与 Groups 的手动拉人群组模型相互独立，见 Groups 段注释）；
  # 群成员不要求互为好友；群主=建群者，退群顺延最早加入者，空群后下一位加入者继任群主。
  /class-groups/mine:
    get:
      tags: [ClassGroups]
      summary: 我的班级单元及群信息
      description: |
        按教育经历（class_name_norm 非空）列出我的全部班级单元，按 enroll_year 升序。
        每个单元 LEFT JOIN 班级群：群尚未创建时 group=null；已创建时返回群信息，
        joined 标识我是否在群内，unread_count 为我的未读数（未入群恒为 0，未读位点按成员独立）。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 班级单元列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ClassGroupUnit' }
  /class-groups/join:
    post:
      tags: [ClassGroups]
      summary: 加入（或创建）班级群
      description: |
        幂等：群不存在则由本次调用创建（created=true，调用者成为群主并直接入群）；
        已存在则直接入群（created=false），重复调用不产生重复成员。
        入群依据=本人教育经历中存在该班级单元（school_id+enroll_year+class_name_norm 三元组），
        否则 40301；不要求与其他群成员互为好友。群无主（created_by 为 NULL，正常路径=空群待任）
        时由本次加入者继任群主。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [school_id, enroll_year]
              properties:
                school_id: { type: integer, format: int64, example: 1001 }
                enroll_year: { type: integer, example: 1996 }
                class_name_norm: { type: string, example: "6-2", description: 规范化班名；与 class_name 二选一，优先生效 }
                class_name: { type: string, example: 六年2班, description: 班名原文，服务端规范化后匹配；与 class_name_norm 二选一 }
      responses:
        '200':
          description: 入群成功（含本次是否新建群）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClassGroupJoinResult' }
        '400':
          description: 参数缺失（school_id/enroll_year 必填；class_name_norm/class_name 至少其一）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 40001, message: "school_id / enroll_year 必填", data: null, trace_id: "t-001" }
        '403':
          description: 非本班——本人教育经历中没有该班级单元（40301）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - example: { code: 40301, message: "仅本班同学可加入：你的教育经历中没有该班级", data: null, trace_id: "t-002" }
  /class-groups/{conv_id}/members:
    get:
      tags: [ClassGroups]
      summary: 班级群成员列表（须为群成员）
      description: |
        姓名展示走可见性引擎（与资料卡同一渐显规则）：非好友同班成员的 real_name 按渐显矩阵掩码，
        客户端不得二次加工。is_owner 标记群主。
      security: [{ bearerAuth: [] }]
      parameters: [ { name: conv_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200':
          description: 成员列表与群主 ID（空群待任时 owner_id 为 null）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ClassGroupMember' }
                          owner_id: { type: integer, format: int64, nullable: true }
        '403': { $ref: '#/components/responses/PrivacyBlocked' }
        '404':
          description: 班级群不存在（41001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 41001, message: "班级群不存在", data: null, trace_id: "t-001" }
  /class-groups/{conv_id}/announcement:
    put:
      tags: [ClassGroups]
      summary: 修改群公告（仅群主，≤200 字）
      description: 须为群成员且是群主，否则 40301；公告超过 200 字（按字符计）返回 40001。
      security: [{ bearerAuth: [] }]
      parameters: [ { name: conv_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                announcement: { type: string, maxLength: 200, example: 本周六上午十点母校门口集合 }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          announcement: { type: string }
        '400':
          description: 群公告超过 200 字（40001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 40001, message: "群公告不超过 200 字", data: null, trace_id: "t-001" }
        '403': { $ref: '#/components/responses/PrivacyBlocked' }
        '404':
          description: 班级群不存在（41001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 41001, message: "班级群不存在", data: null, trace_id: "t-001" }
  /class-groups/{conv_id}/leave:
    post:
      tags: [ClassGroups]
      summary: 退出班级群
      description: |
        移出群成员（退群后发言/拉消息 40301，未读位点随之清除）。
        群主退群且群内还有人 → 群主顺延给最早加入者；退群后群内无人 → created_by 置 NULL，
        群与消息历史保留，由下一位加入者继任群主。
      security: [{ bearerAuth: [] }]
      parameters: [ { name: conv_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { $ref: '#/components/responses/OkEmpty' }
        '403': { $ref: '#/components/responses/PrivacyBlocked' }
        '404':
          description: 班级群不存在（41001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 41001, message: "班级群不存在", data: null, trace_id: "t-001" }

  # ============ HometownGroups（老乡群聊，与老乡圈同边界） ============
  # 语义：家乡同市单元（user_hometowns type=1 的 region_code 前 4 位市级前缀）一一对应一个群会话；
  # 入群依据=本人已设置家乡（type=1，四级行政区划），无 body 参数；群成员不要求互为好友；
