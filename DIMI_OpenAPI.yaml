        '404': { description: 文章不可见或评论不存在 }
  /hometown-contents/{content_id}/gifts:
    parameters:
      - { name: content_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [HometownPages]
      summary: 家乡文章打赏汇总
      description: 返回 total_count（人次）、total_coins（觅豆）和最近 50 条 items。被拉黑或停用用户的身份不下发。文章可见性门禁与详情一致。
      security: [{ bearerAuth: [] }]
