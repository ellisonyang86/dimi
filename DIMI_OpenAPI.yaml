          type: array
          description: 仅共同好友互动可见（服务端已过滤）
          items:
            type: object
            properties:
              from_user: { $ref: '#/components/schemas/UserBrief' }
              reply_to_user: { $ref: '#/components/schemas/UserBrief', nullable: true, description: 被回复人脱敏档案（可见范围内解析不到为 null） }
              content: { type: string }
        created_at: { type: string, format: date-time }
    MomentDetail:
      allOf:
        - $ref: '#/components/schemas/Moment'
        - type: object
          properties:
            comments:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  from_user: { $ref: '#/components/schemas/UserBrief' }
