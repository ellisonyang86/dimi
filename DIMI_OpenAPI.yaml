      security: [{ bearerAuth: [] }]
      parameters:
        - { name: content_id, in: path, required: true, schema: { type: integer } }
        - { name: comment_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 删除成功，重复操作幂等 }
