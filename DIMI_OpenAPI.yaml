                  reply_to_user: { $ref: '#/components/schemas/UserBrief', nullable: true, description: 被回复人脱敏档案（可见范围内解析不到为 null） }
                  content: { type: string }
                  created_at: { type: string, format: date-time }
    ArticleInput:
      type: object
      properties:
        title: { type: string, maxLength: 64 }
        content: { type: string }
        cover_media_id: { type: string }
        column_id: { type: integer, format: int64 }
        visibility: { $ref: '#/components/schemas/MomentVisibility' }
    ArticleBrief:
      type: object
      properties:
        article_id: { type: integer, format: int64 }
        title: { type: string }
        cover_url: { type: string }
        summary: { type: string }
        read_minutes: { type: integer }
        like_count: { type: integer }
        comment_count: { type: integer }
        published_at: { type: string, format: date-time }
    Article:
      allOf:
        - $ref: '#/components/schemas/ArticleBrief'
