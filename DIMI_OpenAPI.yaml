    get:
      tags: [HometownGroups]
      summary: 我的老乡群信息
      description: |
        以本人家乡（type=1）为准：未设置家乡时 items 为空数组；已设置时返回 1 条，
        region_name 为市级行政区名（region_code 前 4 位前缀匹配 regions level=2）。
        LEFT JOIN 老乡群：群尚未创建时 group=null；已创建时返回群信息，
        joined 标识我是否在群内，unread_count 为我的未读数（未入群恒为 0，未读位点按成员独立）。
