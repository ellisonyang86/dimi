          properties:
            author: { $ref: '#/components/schemas/UserBrief' }
            content: { type: string, description: 富文本 JSON }
            word_count: { type: integer }
            column_name: { type: string, nullable: true }
    PrivacySettings:
      type: object
      description: 布尔字段须传 JSON true/false，不接受字符串或数字；add_me_via 仅接受已声明的键及布尔值。
      properties:
        friend_verify_required: { type: boolean, default: true }
        name_mode: { type: string, enum: [open, balanced, strict], default: balanced, description: 真名可见三档（§5.2.8） }
        add_me_via:
          type: object
          additionalProperties: false
          properties:
            dimi_no: { type: boolean, default: true }
            phone: { type: boolean, default: true }
            school_search: { type: boolean, default: true }
            hometown_search: { type: boolean, default: true }
            group: { type: boolean, default: true }
            business_card: { type: boolean, default: true }
            contact_match: { type: boolean, default: true }
        hometown_visibility: { $ref: '#/components/schemas/Visibility' }
        current_city_visible: { type: boolean, default: true }
        stranger_moments_10: { type: boolean, default: false }
        friend_moments_range: { type: string, enum: [all, half_year, one_month, three_days], default: all, description: 含 one_month（契约不变，实现侧 bug 已由服务端修复确认） }
        read_receipt: { type: boolean, default: false }
        typing_visible: { type: boolean, default: true }
        group_temp_chat: { type: boolean, default: false }
        notify_when_searched: { type: boolean, default: false, description: 被检索提醒（§5.2.7） }
        personalized_recommend: { type: boolean, default: true, description: 关闭后推荐接口返回空列表，主动检索仍可用 }
