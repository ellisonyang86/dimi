  /public/hometown-pages/{region_code}:
    get:
      tags: [HometownPages]
      summary: 家乡页公开数据（免鉴权，H5 落地页用）
      description: |
        免鉴权。脱敏边界：items 仅含标题/分类/首图/浏览数/作者掩码昵称/时间——不含 body 全文、
        不含作者 id（不含 UserBrief 任何字段）；昵称按 maskName 掩码（与召集令同规则）。
        作者口径收紧：仅作者家乡可见性（user_hometowns.visibility 与 privacy_settings.hometown_visibility）
        双入口均 public 的内容入选；页面记录未创建时返回缺省计数（公共读路径不写库）。
        按 IP 低频限 60 次/小时，超限 42901（data=null，不走滑块流程）。
      parameters: [ { name: region_code, in: path, required: true, schema: { type: string }, example: "411623102" } ]
      responses:
        '200':
          description: 公开落地页数据（最新 10 条）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HometownPublicPage' }
        '404':
          description: 资源不存在（41001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 41001, message: "资源不存在", data: null, trace_id: "t-001" }
        '429':
          description: 访问过于频繁（42901，60 次/小时/IP）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 42901, message: "访问过于频繁，请稍后再试", data: null, trace_id: "t-001" }

  # ============ Groups ============
  # V3.1 泛化群模型（normal/class/hometown/official，手动拉人/二维码入群），规划态；
  # 与已实现的 ClassGroups 段（/class-groups/*，按班级单元教育经历自动聚班、一单元一群）相互独立，
  # 二者数据模型不共享（Group.group_id vs ClassGroup.conv_id），客户端按 tag 区分。
  /groups:
    post:
      tags: [Groups]
      summary: 创建群（普通/班级/同乡）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_type, name, member_ids]
              properties:
                group_type: { type: string, enum: [normal, class, hometown] }
                name: { type: string, maxLength: 32 }
                member_ids: { type: array, items: { type: integer, format: int64 }, description: ≤40 直接拉入，超出需对方同意 }
                education_id: { type: integer, format: int64, description: 班级群绑定经历 }
                region_code: { type: string, description: 同乡群绑定地区 }
      responses:
        '200':
          description: 建群成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          group_id: { type: integer, format: int64 }
                          conversation_id: { type: integer, format: int64 }
    get:
      tags: [Groups]
      summary: 我的群列表 + 推荐群
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 群组列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          mine: { type: array, items: { $ref: '#/components/schemas/Group' } }
                          recommended: { type: array, items: { $ref: '#/components/schemas/Group' } }
  /groups/{group_id}/members:
    post:
      tags: [Groups]
      summary: 拉人入群
      security: [{ bearerAuth: [] }]
