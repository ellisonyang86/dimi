    post:
      tags: [HometownPages]
      summary: 使用觅豆打赏家乡文章作者
      description: 支持 Idempotency-Key；面额 1/5/10/52/100，禁止自赏与透支。与动态打赏共用每日次数上限。扣币、入账、订单、文章累计同事务提交；失败整体回滚。觅豆无充值、无提现。
      security: [{ bearerAuth: [] }]
      requestBody:
