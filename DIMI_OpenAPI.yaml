  # ============ HometownPages（家乡页·镇级共建，M1 已实现范围） ============
  # 语义：镇级行政区划（regions level=4）一页，页面记录首次投稿/关注时创建（GET 页聚合为懒返回缺省，
  # 不在读路径落库）；content_count 为查询时实时 COUNT（status=published），不依赖冗余列；
  # 投稿资格与老乡圈/老乡群同边界（作者籍贯 user_hometowns type=1 与目标镇市级前缀前 4 位一致，
  # 不符 40301「只有当地老乡才能向该家乡页投稿」）；投稿频控 5 条/日/人（42901，落库成功后才计数）；
  # 关注/取关频控 100 次/日/人（42901）；联系方式/导流机器拦截 45001（M1 无审核队列，机器拦截即初审，
  # 通过直接 published）。
  # 作者隐私口径：作者家乡可见性（user_hometowns.visibility 或 privacy_settings.hometown_visibility）
  # 任一为 private 时，其内容对非作者一律缺省（列表过滤 / 详情 41001）；公开落地页再收紧，
  # 仅双入口均 public 的作者内容入选，昵称掩码下发。
  # M1 不做：热度榜/名片区/置顶/守护人（hometown_contents 的 pinned_by/pinned_at/heat/gift_coins
  # 字段按设计 §9 预留，M2 再消费，当前接口不返回）。
  /hometown-pages/followed/mine:
    get:
      tags: [HometownPages]
      summary: 我关注的家乡页列表
      description: 按关注时间倒序，上限 100 条；随账号跨设备同步。注意须在 /hometown-pages/{region_code} 之前注册（先注册先匹配）。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 关注列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { $ref: '#/components/schemas/ResponseCode' }
                  message: { type: string }
                  trace_id: { type: string }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            region_code: { type: string }
                            region_path: { type: array, items: { type: string } }
                            cover_media: { type: string, nullable: true }
                            follower_count: { type: integer }
                            content_count: { type: integer, description: 实时 COUNT（published） }
                            followed_at: { type: string, format: date-time }
  /hometown-pages/{region_code}:
    get:
      tags: [HometownPages]
      summary: 家乡页聚合（页不存在时懒返回缺省，不落库）
      description: |
        region_path 为省/市/区县/镇名称逐级数组（regions 表祖先链）；
        can_post=我籍贯与该镇同市（前 4 位前缀一致）；is_following=我是否已关注；
        group 为该市老乡群入口卡（复用 hometown_groups，群未创建为 null）。
        页面记录未创建时返回缺省（cover_media=null、intro=""、follower_count=0），
        建页只在写路径发生（首次投稿 / 首次关注）；content_count 为实时 COUNT（published）。
      security: [{ bearerAuth: [] }]
      parameters: [ { name: region_code, in: path, required: true, schema: { type: string }, example: "411623102", description: 镇级行政区划码（四级） } ]
      responses:
        '200':
          description: 家乡页聚合数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HometownPage' }
        '400':
          description: 非四级行政区划（40001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 40001, message: "家乡页以乡镇/街道（四级行政区划）为单位", data: null, trace_id: "t-001" }
        '404':
          description: 行政区划不存在（41001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 41001, message: "行政区划不存在", data: null, trace_id: "t-001" }
  /hometown-pages/{region_code}/contents:
    get:
      tags: [HometownPages]
      summary: 家乡页内容分页（最新区，倒序 cursor）
      description: |
        status=published 且归属该镇的内容按 content_id 倒序 cursor 分页 20 条，category 可选过滤。
        低密度兜底：该镇内容 <5 条且无 cursor 时，附加 rollup_items=同县（前 6 位）其他镇最新内容
        最多 5 条（每条带 rolled_up:true 标记）；翻页（带 cursor）不触发兜底。
        顶层 rolled_up=是否存在兜底内容（rollup_items 非空），客户端据此渲染兜底分区。
        作者家乡两处可见性取交集：private 仅本人，friends 仅好友，fellows_only 同市老乡或好友，public 公开；双向拉黑和非活跃作者内容不下发。先做可见性过滤再分页。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: region_code, in: path, required: true, schema: { type: string }, example: "411623102" }
        - { name: category, in: query, schema: { type: string, enum: [scenery, product, craft, story] }, description: 风光/特产/手艺/故事 }
        - { name: cursor, in: query, schema: { type: string }, description: 上一页末条 content_id }
      responses:
        '200':
          description: 内容分页（含低密度兜底）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/HometownContent' }
                          rollup_items:
                            type: array
                            description: 低密度兜底（同县其他镇，均带 rolled_up:true）
                            items: { $ref: '#/components/schemas/HometownContent' }
                          rolled_up: { type: boolean, description: 顶层兜底标记：rollup_items 非空即 true }
                          next_cursor: { type: string, nullable: true }
        '400':
          description: 参数错误（40001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 40001, message: "参数错误", data: null, trace_id: "t-001" }
        '404':
          description: 资源不存在（41001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 41001, message: "资源不存在", data: null, trace_id: "t-001" }
  /hometown-contents:
    post:
      tags: [HometownPages]
      summary: 投稿家乡页（幂等，资格门禁+频控+内容拦截）
      description: |
        支持 Idempotency-Key 通用幂等层（重放返回原内容，message=ok(idempotent)）。
        校验顺序：区划与参数（40001）→ 投稿资格（40301：作者籍贯与目标镇市级前缀前 4 位一致）
        → 联系方式/导流拦截（45001，落审计 content_block）→ 频控 5 条/日/人（42901）。
        M1 无审核队列：通过即 status=published，首次投稿自动建页并落审计（hometown_content_publish）；
        频控计数在 INSERT 成功后（校验失败/拦截不占当日额度），content_count 为查询时实时计数。
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [region_code, category, title]
              properties:
                region_code: { type: string, example: "411623102", description: 目标镇（四级行政区划） }
                category: { type: string, enum: [scenery, product, craft, story] }
                title: { type: string, maxLength: 60, example: 沙河渡口晚霞 }
                body: { type: string, maxLength: 20000 }
                media:
                  type: array
                  maxItems: 9
                  items: { type: string, description: /misc/upload 返回的媒体 url（jpg/jpeg/png/webp） }
      responses:
        '200':
          description: 投稿成功（直接 published）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HometownContent' }
        '400':
          description: 参数错误（40001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 40001, message: "参数错误", data: null, trace_id: "t-001" }
        '403':
          description: 非当地老乡（40301）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 40301, message: "只有当地老乡才能向该家乡页投稿", data: null, trace_id: "t-001" }
        '429':
          description: 今日投稿已达上限（42901，5 条/日/人）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 42901, message: "今日投稿已达上限（5 条/日）", data: { captcha_required: true }, trace_id: "t-001" }
        '450':
          description: 内容包含联系方式或导流信息（45001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 45001, message: "内容包含联系方式或导流信息，已被拦截", data: null, trace_id: "t-001" }
  /hometown-contents/{content_id}:
    delete:
      tags: [HometownPages]
      summary: 删除本人投稿
      description: 仅作者可操作。软删除后列表、详情、点赞及公开分享页立即不可见；保留审核记录。
      security: [{ bearerAuth: [] }]
      parameters: [ { name: content_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '403': { $ref: '#/components/responses/PrivacyBlocked' }
        '404':
          description: 内容不存在（41001）
    get:
      tags: [HometownPages]
      summary: 内容详情（触发浏览去重计数）
      description: |
        浏览计数去重：同人同内容 24h 只计 1 次（hometown_views PRIMARY KEY + viewed_at 判定，位点超 48h 由 janitor 清理）。
        作者非活跃、双方拉黑或不满足作者家乡可见性（public/friends/fellows_only/private）时返回 41001，点赞使用相同门禁。
      security: [{ bearerAuth: [] }]
      parameters: [ { name: content_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200':
          description: 内容详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HometownContent' }
        '400':
          description: 参数错误（40001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 40001, message: "参数错误", data: null, trace_id: "t-001" }
        '404':
          description: 内容不存在或已下架（41001）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example: { code: 41001, message: "内容不存在或已下架", data: null, trace_id: "t-001" }
  /hometown-contents/{content_id}/comments:
    parameters:
      - { name: content_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [HometownPages]
      summary: 家乡文章评论分页
      description: 文章可见性门禁与详情一致。按评论 ID 倒序，每页 20 条；过滤非活跃及与当前读者拉黑的评论者。返回 items、total_count、next_cursor，每条包含 id、content、from_user、created_at、can_delete。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: 可见评论分页，末页 next_cursor 为 null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404': { description: 文章不可见或已删除 }
    post:
      tags: [HometownPages]
      summary: 发表家乡文章评论
      description: 支持 Idempotency-Key；每人每日最多 100 条，联系方式拦截与文章一致。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
