    get:
      tags: [Groups]
      summary: 群成员列表（班级群返回点名册视图，姓名按渐显矩阵）
      security: [{ bearerAuth: [] }]
      parameters: [ { name: group_id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200':
          description: 成员分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
