        - $ref: '#/components/schemas/RedPacket'
        - type: object
          properties:
            claims:
              type: array
              description: 领取列表（按领取先后）
              items:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserBrief' }
                  amount: { type: integer }
                  is_best: { type: boolean, description: 是否手气最佳（领完时结算） }
                  created_at: { type: string, format: date-time }
            my_claim:
              type: object
              nullable: true
              description: 我的领取记录，未领取为 null
              properties:
                amount: { type: integer }
                is_best: { type: boolean }
