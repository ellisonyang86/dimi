        claim_status: { type: string, enum: [unclaimed, claiming, claimed, blurred], description: 未认领/认领中/已认领/已模糊 }
        correct_count: { type: integer, description: 纠错次数，≥2 自动隐藏并通知上传者（A2.4） }
