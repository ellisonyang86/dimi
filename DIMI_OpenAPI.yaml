  /hometown-groups/{conv_id}/leave:
    post:
      tags: [HometownGroups]
      summary: 退出老乡群
      description: |
        移出群成员（退群后发言/拉消息 40301，未读位点随之清除）。
        群主退群且群内还有人 → 群主顺延给最早加入者；退群后群内无人 → created_by 置 NULL，
        群与消息历史保留，由下一位加入者继任群主。
