<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIMI · 围城 — 可点击原型 V3.1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  body { background:#2b2f36; min-height:100vh; padding:24px; }
  h1 { color:#fff; font-size:20px; text-align:center; margin-bottom:6px; }
  .sub { color:#9aa0a8; font-size:13px; text-align:center; margin-bottom:20px; }
  .nav { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:24px; max-width:900px; margin-left:auto; margin-right:auto; }
  .nav button { background:#3a4048; color:#cfd3d8; border:none; padding:8px 14px; border-radius:18px; font-size:13px; cursor:pointer; }
  .nav button.on { background:#07C160; color:#fff; }
  .stage { display:flex; justify-content:center; }
  .phone { width:375px; height:760px; background:#f5f5f5; border-radius:36px; overflow:hidden; position:relative;
           box-shadow:0 20px 60px rgba(0,0,0,.5); display:none; flex-direction:column; }
  .phone.on { display:flex; }
  .statusbar { height:44px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:#111; flex-shrink:0; position:relative;}
  .statusbar .back { position:absolute; left:14px; font-weight:400; color:#555; cursor:pointer; }
  .body { flex:1; overflow-y:auto; }
  .tabbar { height:56px; background:#fff; border-top:1px solid #e5e5e5; display:flex; flex-shrink:0; }
  .tabbar div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; color:#888; cursor:pointer; }
  .tabbar div.on { color:#07C160; }
  .tabbar .ic { font-size:20px; margin-bottom:2px; }
  /* 通用组件 */
  .card { background:#fff; border-radius:10px; margin:10px 12px; padding:14px; }
  .green { color:#07C160; }
  .muted { color:#999; font-size:12px; }
  .btn-green { background:#07C160; color:#fff; border:none; border-radius:6px; padding:8px 18px; font-size:14px; cursor:pointer; }
  .btn-ghost { background:#f0f0f0; color:#555; border:none; border-radius:6px; padding:8px 18px; font-size:14px; cursor:pointer; }
  .banner { background:linear-gradient(90deg,#e8f8ef,#f4fbf7); border-left:3px solid #07C160; padding:10px 12px; font-size:13px; color:#1a7a4a; border-radius:6px; }
  .avatar { width:46px; height:46px; border-radius:6px; background:#d8d8d8; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; }
  .tag { display:inline-block; background:#e8f8ef; color:#07C160; font-size:11px; padding:2px 7px; border-radius:4px; margin-right:5px; }
  .tag2 { background:#fff3e6; color:#e8890c; }
  .row { display:flex; align-items:center; gap:10px; }
  .person { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid #f0f0f0; }
  .person:last-child { border-bottom:none; }
  .person .info { flex:1; min-width:0; }
  .person .name { font-size:15px; font-weight:600; color:#111; }
  .person .reason { font-size:12px; color:#999; margin-top:3px; }
  /* 弹窗 */
  .mask { position:absolute; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:10; }
  .mask.on { display:flex; }
  .sheet { background:#fff; width:100%; border-radius:16px 16px 0 0; padding:18px 16px 26px; }
  .sheet h3 { font-size:16px; margin-bottom:4px; }
  .sheet textarea { width:100%; border:1px solid #e0e0e0; border-radius:8px; padding:10px; font-size:14px; margin:12px 0 8px; resize:none; height:64px; }
  .checkline { display:flex; align-items:center; gap:8px; font-size:13px; color:#333; padding:6px 0; }
  .checkline input { accent-color:#07C160; width:16px; height:16px; }
  /* 聊天气泡 */
  .msg { display:flex; margin:12px; gap:8px; }
  .msg.me { flex-direction:row-reverse; }
  .bub { max-width:230px; background:#fff; border-radius:8px; padding:9px 12px; font-size:14px; line-height:1.5; }
  .msg.me .bub { background:#95ec69; }
  .sys { text-align:center; margin:10px 0; }
  .sys span { background:rgba(0,0,0,.08); color:#fff; font-size:11px; padding:3px 10px; border-radius:9px; }
  .icebreak { margin:12px; background:#fff; border-radius:10px; padding:12px; text-align:center; font-size:13px; color:#555; border:1px dashed #07C160; }
  .inputbar { background:#f7f7f7; border-top:1px solid #e5e5e5; padding:8px 10px; display:flex; gap:8px; align-items:center; flex-shrink:0; }
  .inputbar .inp { flex:1; background:#fff; border-radius:6px; height:34px; padding:0 10px; font-size:14px; border:1px solid #e8e8e8; }
  /* 朋友圈 */
  .cover { height:280px; background:linear-gradient(135deg,#8e9eab,#eef2f3); position:relative; }
  .cover .me { position:absolute; right:14px; bottom:-22px; display:flex; align-items:center; gap:10px; }
  .cover .me .avatar { width:60px; height:60px; border:2px solid #fff; }
  .moment { background:#fff; padding:14px 12px; display:flex; gap:10px; border-bottom:1px solid #f2f2f2; }
  .moment .cnt { flex:1; min-width:0; }
  .moment .aname { color:#576b95; font-weight:600; font-size:14px; }
  .moment .txt { font-size:14px; color:#111; margin:4px 0; line-height:1.5; }
  .grid9 { display:grid; grid-template-columns:repeat(3,72px); gap:4px; margin:6px 0; }
  .grid9 div { width:72px; height:72px; background:#ddd; border-radius:4px; }
  .artcard { display:flex; gap:10px; background:#f7f7f7; border-radius:8px; padding:10px; margin:6px 0; cursor:pointer; }
  .artcard .cov { width:64px; height:64px; border-radius:6px; background:linear-gradient(135deg,#c9d6df,#52616b); flex-shrink:0; }
  .artcard .t { font-size:14px; font-weight:600; color:#111; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .artcard .s { font-size:12px; color:#777; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .artcard .m { font-size:11px; color:#aaa; margin-top:4px; }
  .likebar { background:#f7f7f7; border-radius:6px; padding:6px 10px; font-size:12px; color:#576b95; margin-top:6px; }
  /* 设置 */
  .setrow { background:#fff; padding:14px 14px; display:flex; align-items:center; font-size:15px; border-bottom:1px solid #f2f2f2; }
  .setrow .val { margin-left:auto; color:#999; font-size:13px; }
  .setrow .sw { margin-left:auto; width:44px; height:26px; border-radius:13px; background:#07C160; position:relative; }
  .setrow .sw.off { background:#ddd; }
  .setrow .sw::after { content:''; position:absolute; width:22px; height:22px; border-radius:50%; background:#fff; top:2px; right:2px; }
  .setrow .sw.off::after { right:20px; }
  .setgap { height:10px; background:#f5f5f5; }
  .seg { display:flex; background:#f0f0f0; border-radius:8px; padding:3px; margin:10px 14px; }
  .seg div { flex:1; text-align:center; font-size:13px; padding:7px 0; border-radius:6px; color:#555; }
  .seg div.on { background:#fff; color:#07C160; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .searchbox { margin:10px 12px; background:#fff; border-radius:8px; padding:10px 12px; font-size:14px; color:#bbb; display:flex; gap:8px; align-items:center; }
  .filterrow { display:flex; gap:8px; padding:0 12px 10px; flex-wrap:wrap; }
  .chip { background:#fff; border:1px solid #e0e0e0; border-radius:16px; padding:6px 12px; font-size:13px; color:#555; }
  .chip.on { background:#07C160; color:#fff; border-color:#07C160; }
  /* V3.1 新增组件 */
  .tag-blue { background:#e6f0ff; color:#2b6de0; }
  .tag-red { background:#ffe9e9; color:#d64545; }
  .tag-purple { background:#f3eaff; color:#8a5bd6; }
  .tag-warn { background:#fff3e6; color:#e8890c; }
  .photo-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .face { aspect-ratio:1/1; background:#e3e3e3; border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; color:#999; cursor:pointer; position:relative; overflow:hidden; }
  .face.claimed { background:#07C160; color:#fff; font-weight:600; font-size:13px; }
  .face .loc { font-size:10px; color:#bbb; margin-top:2px; }
  .face.claimed .loc { color:rgba(255,255,255,.85); }
  .face .blur { font-size:9px; color:#bbb; margin-top:2px; }
  .aibadge { position:absolute; top:6px; right:6px; background:rgba(7,193,96,.9); color:#fff; font-size:10px; padding:1px 6px; border-radius:8px; }
  .pathcard { background:#fff; border:1px solid #e0e0e0; border-radius:10px; margin:10px 12px; padding:14px; cursor:pointer; }
  .pathcard .pt { font-size:15px; font-weight:600; color:#111; }
  .pathcard .pd { font-size:12px; color:#999; margin-top:4px; line-height:1.6; }
  .mapline { display:flex; flex-direction:column; padding:6px 0 6px 8px; }
  .mnode { display:flex; gap:12px; position:relative; padding-bottom:22px; }
  .mnode:last-child { padding-bottom:4px; }
  .mnode::before { content:''; position:absolute; left:5px; top:16px; bottom:0; width:2px; background:#07C160; opacity:.35; }
  .mnode:last-child::before { display:none; }
  .mnode .dot { width:12px; height:12px; border-radius:50%; background:#07C160; flex-shrink:0; margin-top:4px; position:relative; z-index:1; }
  .mnode .mcity { font-size:14px; font-weight:600; color:#111; }
  .mnode .mexp { font-size:12px; color:#777; margin-top:2px; line-height:1.6; }
  .evcard { background:#fff; border-radius:10px; margin:10px 12px; padding:12px 14px; }
  .evcard .et { font-size:14px; font-weight:600; color:#111; margin-top:6px; }
  .evcard .ed { font-size:12px; color:#999; margin-top:3px; line-height:1.6; }
  .stack { display:flex; padding:6px 0; }
  .stack .avatar { width:30px; height:30px; border-radius:50%; border:2px solid #fff; margin-right:-8px; font-size:12px; }
  .viptable { width:100%; border-collapse:collapse; font-size:13px; }
  .viptable th, .viptable td { padding:9px 6px; border-bottom:1px solid #f0f0f0; text-align:left; }
  .viptable th { font-size:12px; color:#999; font-weight:400; }
  .viptable td:last-child { color:#07C160; font-weight:600; }
  .redline { background:#fff5f5; border:1px solid #f2c1c1; border-radius:10px; margin:10px 12px; padding:14px; font-size:13px; color:#a33; line-height:1.7; }
  .elderbtn { display:flex; align-items:center; gap:14px; background:#fff; border:none; border-radius:14px; margin:12px 14px; padding:0 20px; min-height:96px; width:calc(100% - 28px); font-size:24px; font-weight:700; color:#111; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.06); text-align:left; }
  .elderbtn .eic { font-size:36px; }
  .elderbtn .esub { font-size:14px; font-weight:400; color:#888; margin-top:4px; }
  .fraud { margin:12px; background:#fff8e6; border:1px solid #f0d48a; border-radius:10px; padding:12px; font-size:13px; color:#8a6116; line-height:1.7; }
  .tagchip { display:inline-flex; align-items:center; gap:6px; background:#e8f8ef; color:#07C160; font-size:13px; padding:7px 12px; border-radius:16px; margin:0 8px 8px 0; }
  .tagchip .x { width:16px; height:16px; border-radius:50%; background:#07C160; color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
</style>
</head>

const stage = document.getElementById('stage');
const nav = document.getElementById('nav');
SCREENS.forEach(s => {
  const p = document.createElement('div');
  p.className = 'phone'; p.id = 'pg-' + s.id; p.innerHTML = PAGES[s.id];
  stage.appendChild(p);
  const b = document.createElement('button');
  b.textContent = s.name; b.id = 'nb-' + s.id; b.onclick = () => go(s.id);
  nav.appendChild(b);
});
function go(id){
  SCREENS.forEach(s => {
    document.getElementById('pg-'+s.id).classList.toggle('on', s.id===id);
    document.getElementById('nb-'+s.id).classList.toggle('on', s.id===id);
  });
  window.scrollTo({top:0, behavior:'smooth'});
}
function tagFace(loc){
  document.getElementById('tag-loc').textContent = loc + ' — 这张照片上的人是谁？';
  document.getElementById('mask-tag').classList.add('on');
}
go('renmai');
</script>
